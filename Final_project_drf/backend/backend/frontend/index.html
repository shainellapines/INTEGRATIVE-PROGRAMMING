<!DOCTYPE html>
<html>
<head>
    <title>CineMatch</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar glass px-4 py-3 d-flex justify-content-between align-items-center">
    <h2 class="logo m-0">
        <i class="bi bi-film"></i> CineMatch
    </h2>

    <div class="d-flex gap-2">
        <input id="username" class="form-control form-control-sm" placeholder="Username">
        <button onclick="login()" class="btn btn-light btn-sm">
            <i class="bi bi-person"></i> Login
        </button>
    </div>
</nav>

<div class="container">

<!-- HERO -->
<div id="hero" class="hero glass mb-4">
    <div class="hero-content">
        <h1 id="hero-title">Featured Movie</h1>
        <p id="hero-desc"></p>
        <button onclick="playRandom()" class="btn btn-primary">
            <i class="bi bi-play-fill"></i> Play
        </button>
    </div>
</div>

<!-- CONTROLS -->
<div class="controls d-flex gap-2 flex-wrap justify-content-center mb-4">
    <input id="search" class="form-control" placeholder="Search movie">

    <button onclick="loadMovies()" class="btn btn-primary">
        <i class="bi bi-search"></i> Search
    </button>

    <!-- GENRE FILTER -->
    <select id="genre" class="form-select">
        <option value="">Genre</option>
        <option value="action">Action</option>
        <option value="sci-fi">Sci-fi</option>
        <option value="drama">Drama</option>
        <option value="fantasy">Fantasy</option>
        <option value="crime">Crime</option>
        <option value="horror">Horror</option>
        <option value="romance">Romance</option>
        <option value="comedy">Comedy</option>
        <option value="animation">Animation</option>
        <option value="thriller">Thriller</option>
    </select>

    <!-- MOOD FILTER -->
    <select id="mood" class="form-select">
        <option value="">Mood</option>
        <option value="happy">😊 Happy</option>
        <option value="sad">😢 Sad</option>
        <option value="excited">🔥 Excited</option>
        <option value="scary">👻 Scary</option>
        <option value="fantasy">✨ Fantasy</option>
    </select>

    <button onclick="loadRecommendations()" class="btn btn-success">
        <i class="bi bi-magic"></i> Recommend
    </button>
</div>

<!-- WATCHLIST -->
<h2 class="text-center">My Watchlist</h2>
<div class="text-center mb-3">
    <button onclick="loadWatchlist()" class="btn btn-outline-light">
        <i class="bi bi-heart"></i> Load Watchlist
    </button>
</div>
<div id="watchlist"></div>

<!-- TRENDING -->
<h2 class="text-center">Trending</h2>
<div id="trending"></div>

<!-- MOVIES -->
<h2 class="text-center">Movies</h2>
<div id="movies"></div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">
            <i class="bi bi-x-lg"></i>
        </span>
        <div id="modal-body"></div>
    </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
